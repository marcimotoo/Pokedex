<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="icon" href="./assets/svg/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/fonts.css " />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/loading.css" />
    <link rel="stylesheet" href="./styles/overlay.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="./scripts/api.js"></script>
    <script src="./scripts/template.js"></script>
    <script src="./scripts/overlay.js"></script>
    <script src="script.js"></script>
  </head>
  <body onload="init()">
    <header>
      <svg class="header-pokeball" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="#f5f6f8" />
        <path d="M3 24a21 21 0 0 1 42 0Z" fill="#e45b56" />
        <circle cx="24" cy="24" r="21" fill="none" stroke="#151b24" stroke-width="3" />
        <path d="M3 24h42" stroke="#151b24" stroke-width="4" />
        <circle cx="24" cy="24" r="7" fill="#f5f6f8" stroke="#151b24" stroke-width="4" />
      </svg>
      <h1>Pokédex</h1>
      <div class="header-actions">
        <div class="search-field">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="10" cy="10" r="6" />
            <path d="M15 15L21 21" />
          </svg>
          <input oninput="filterAndShowPokemon()" id="filter_input" type="text" placeholder="Name, Typ, Pokédex-Nr." aria-label="Pokémon suchen" />
        </div>
        <button class="load-pokemon-button" onclick="showAllPokemon()" aria-label="Alle Pokémon laden und anzeigen">Zeig mir ALLE!</button>
      </div>
    </header>
    <main>
      <div id="loading-screen">
        <div class="loading-card" role="status" aria-live="polite">
          <img src="./assets/gif/running-pikachu.gif" alt="Laufendes Pikachu" />
          <p>Pokémon werden geladen …</p>
          <div class="loading-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <section>
        <ul id="pokemon_card_content"></ul>
      </section>
      <button class="load-pokemon-button" id="more_pokemon" onclick="loadMorePokemon()" aria-label="Weitere Pokémon laden und anzeigen">mehr Pokemon!</button>
      <dialog closedby="any" class="overlay_dialog" id="overlay_dialog" aria-label="Pokémon-Details" onclose="document.body.style.overflow = ''"></dialog>
    </main>
    <footer>
      <p>Pokédex <span aria-hidden="true">·</span> Daten von <a href="https://pokeapi.co/">PokéAPI</a></p>
    </footer>
  </body>
</html>
